<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Powder Blue Todo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <h1>Todo List</h1>
      <p class="subtitle">Add tasks, mark them in progress, then done when completed.</p>

      <form id="task-form" class="task-form" autocomplete="off">
        <input
          id="task-input"
          type="text"
          placeholder="What do you need to do?"
          maxlength="120"
          required
        />
        <button type="submit">Add Task</button>
      </form>

      <section class="panel">
        <h2>Todo</h2>
        <ul id="todo-list" class="task-list"></ul>
        <p id="todo-empty" class="empty-state">No pending tasks.</p>
      </section>

      <section class="panel">
        <h2>In Progress</h2>
        <ul id="inprogress-list" class="task-list inprogress"></ul>
        <p id="inprogress-empty" class="empty-state">No tasks in progress.</p>
      </section>

      <section class="panel">
        <h2>Done</h2>
        <ul id="done-list" class="task-list done"></ul>
        <p id="done-empty" class="empty-state">No completed tasks yet.</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
